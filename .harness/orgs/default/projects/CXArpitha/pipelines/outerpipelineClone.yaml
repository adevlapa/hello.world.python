pipeline:
  projectIdentifier: CXArpitha
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: approval
        identifier: approval
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: test
                  identifier: test
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please review the following information
                      and approve the pipeline progression
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account._account_all_users
                    isAutoRejectEnabled: false
                    approverInputs: []
        tags: {}
    - stage:
        name: innerpipeline
        identifier: innerpipeline
        description: ""
        type: Pipeline
        spec:
          org: default
          project: CXArpitha
          pipeline: innerpipeline
          gitBranch: branch1-patch2
          inputs: {}
  identifier: outerpipelineClone
  name: outerpipelineClone
